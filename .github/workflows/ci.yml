name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Two tiers of job.
#
# Blocking jobs run checks that were verified on the development machine
# before this workflow was written, so a red result means a real
# regression rather than a surprise from a tool nobody had run yet.
#
# Reporting jobs are measurements rather than gates: mutation, size and
# coverage. They are marked continue-on-error, and a red one still means
# something, which is why each fails on a finding instead of printing it.
# Flip one to blocking only once a run of it comes back clean.
#
# Every job names its runner image rather than ubuntu-latest. The MISRA
# check pins Rule 10.4 findings by source line, and the cppcheck that
# produces them comes from the image's package archive; an image upgrade
# would change the analyser underneath a green check without any change
# here. Move the image on purpose, in one commit, and read the result.

jobs:

  # ---------------------------------------------------------------- blocking

  test:
    name: Test (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [ gcc, clang ]
    steps:
      - uses: actions/checkout@v5

      # One suite per module, found from src/ rather than listed here, so a
      # module added without touching this file is still built and run. The
      # suite is the module name with its second letter capitalised, the rule
      # tools/tracecheck.py applies.
      - name: Build and run every module's suite
        run: |
          status=0
          for f in src/*/*.c; do
            d=$( basename "$( dirname "$f" )" ); n=$( basename "$f" .c ); rest=${n:1}; t="S${rest^}"
            echo "== $n"
            if ! ${{ matrix.cc }} -Wall -Wextra -Wpedantic -std=c99 -g \
                 -I"inc/$d" "test/${t}_Test/${t}_Test.c" "$f" -o "${n}_test"; then
              echo "::error::$n did not build with ${{ matrix.cc }}"; status=1; continue
            fi
            if ! "./${n}_test"; then
              echo "::error::the $n suite failed with ${{ matrix.cc }}"; status=1
            fi
          done
          exit $status

      # The generated modules must still be exactly what their generator
      # produces. A non empty diff means somebody edited the output by hand
      # and the next generator run would silently revert it.
      - name: Check the generated modules have not drifted
        run: |
          python3 tools/gen_sarray.py
          python3 tools/gen_sarray_test.py
          python3 tools/gen_smath.py
          python3 tools/gen_smath_test.py
          git diff --stat
          git diff --exit-code

  sanitizers:
    name: ASan and UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # AddressSanitizer does not link under zig on the Windows development
      # machine, which is why the out of bounds read in sstringCopy had to
      # be proven with a guard page instead. Here it works, so this is the
      # first place the module is checked by a real memory sanitizer.
      - name: Build and run every module's suite under the sanitizers
        run: |
          status=0
          for f in src/*/*.c; do
            d=$( basename "$( dirname "$f" )" ); n=$( basename "$f" .c ); rest=${n:1}; t="S${rest^}"
            echo "== $n"
            if ! clang -Wall -Wextra -std=c99 -g \
                 -fsanitize=address,undefined -fno-sanitize-recover=all \
                 -fno-omit-frame-pointer \
                 -I"inc/$d" "test/${t}_Test/${t}_Test.c" "$f" -o "${n}_san"; then
              echo "::error::$n did not build with the sanitizers"; status=1; continue
            fi
            if ! "./${n}_san"; then
              echo "::error::the $n suite failed under the sanitizers"; status=1
            fi
          done
          exit $status

  cross-compile:
    name: Cross compile for ARM
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install the ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      # Compiles only. The runner cannot execute an ARM binary, so this
      # says the code builds for the target, not that it behaves there.
      - name: Compile every module
        run: |
          for f in src/*/*.c; do
            d=$(basename $(dirname "$f"))
            echo "== $f"
            arm-none-eabi-gcc -c -Wall -Wextra -Wpedantic -std=c99 \
              -I"inc/$d" "$f" -o /dev/null
          done

      - name: Run the ARM gcc analyzer
        run: |
          for f in src/*/*.c; do
            d=$(basename $(dirname "$f"))
            echo "== $f"
            arm-none-eabi-gcc -c -Wall -Wextra -Wpedantic -std=c99 -fanalyzer \
              -I"inc/$d" "$f" -o /dev/null
          done

      # Stack use on two cores, from -fstack-usage and the call graph. Fails
      # on a dynamic frame or on recursion, after a control holding both.
      # Reporting until a CI run of it comes back clean.
      - name: Stack use and recursion
        continue-on-error: true
        run: python3 tools/stack.py --annotate

      # Every header must be independently includable and must coexist with
      # the others. This is what catches a duplicate include guard or a
      # clashing typedef.
      - name: Check that all headers coexist
        run: |
          for h in inc/*/*.h; do echo "#include \"$(basename $h)\""; done > allhdr.c
          echo "int main(void){return 0;}" >> allhdr.c
          arm-none-eabi-gcc -c -Wall -Wextra \
            $(for d in inc/*/; do printf " -I%s" "$d"; done) \
            allhdr.c -o /dev/null

  # --------------------------------------------------------------- reporting

  readme-example:
    name: The README example still compiles
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      # Blocking. It is the only thing in the repository that uses more
      # than one module at once: every test suite covers a single module,
      # so nothing else would notice the example drifting out of step with
      # the library, and it is the first code a reader meets.
      - name: Extract it from README.md and build it
        run: |
          awk '/^```c$/{f=1;next} /^```$/{f=0} f' README.md > example.c
          test -s example.c
          printf 'int main(void){return 0;}\n' > examplemain.c
          gcc -Wall -Wextra -Wpedantic -std=c99 \
            -Iinc/ring -Iinc/string -Iinc/math \
            example.c examplemain.c \
            src/ring/sring.c src/string/sstring.c src/math/smath.c \
            -o readme_example

  integration:
    name: The modules working together
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      # Blocking. Every other suite tests one module; this one runs
      # several of them as a chain. A module can satisfy its own contract
      # exactly and still be impossible to use next to its neighbour,
      # and until this existed nothing would have noticed.
      - name: Build the integration test program
        run: |
          gcc -Wall -Wextra -Wpedantic -std=c99 -g \
            $( for d in inc/*/; do printf -- " -I%s" "${d%/}"; done ) \
            test/Integration_Test/Integration_Test.c \
            src/*/*.c \
            -o integration_test

      - name: Run it
        run: ./integration_test

      - name: And again under the sanitizers
        run: |
          clang -Wall -Wextra -std=c99 -g \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -fno-omit-frame-pointer \
            $( for d in inc/*/; do printf -- " -I%s" "${d%/}"; done ) \
            test/Integration_Test/Integration_Test.c \
            src/*/*.c \
            -o integration_san
          ./integration_san

  doxygen-convention:
    name: Doxygen comment convention
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      # Blocking, unlike the doxygen job below. This one checks the
      # things doxygen would not: that a @param list matches the
      # signature in both directions, and that a @return names every
      # status the body can produce and no status it cannot. It runs
      # clean on the development machine, so a red result here is a
      # real regression.
      - name: Check the comments against the convention
        run: python3 tools/doxcheck.py

      # The declarations, as opposed to the comments. The first rule it
      # checks is the one this library is arranged around: every pointer
      # to a buffer is immediately followed by that buffer's capacity.
      # Deriving a bound from a different buffer was a real defect here
      # once, and a guard page test reproduced it as a fault.
      - name: Check the API against the rules the library states
        run: python3 tools/apicheck.py

      # Every status a return block promises is expected by at least one
      # case in the module's own suite, or recorded with its reason in
      # tools/trace_exceptions.tsv. The controls run first, so a checker
      # that has stopped checking cannot pass.
      - name: Trace every promised status to a case that expects it
        run: |
          python3 tools/tracecheck.py --self-test
          python3 tools/tracecheck.py

  mutation:
    name: Mutation tests (reporting)
    runs-on: ubuntu-24.04
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      # Reporting rather than blocking only because it takes a while:
      # 205 mutants, each a full build and run of one suite. It runs
      # clean on the development machine, so a survivor here is a real
      # hole in a suite rather than a discovery about a tool nobody had
      # used. Twenty mutants are expected to survive and are marked
      # equivalent with the argument for each; the runner requires them
      # to survive, so a wrong argument shows up as RESURRECTED.
      - name: Break every module on purpose
        run: |
          CC=gcc UBSANCC=clang python3 tools/mutate.py

  size:
    name: What each module costs on a target (reporting)
    runs-on: ubuntu-24.04
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      - name: Install the ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      # Reporting, because the number is information rather than a gate:
      # what counts as too big is the integrator's budget and not ours.
      # It does assert one thing, though. Every module must show .data and
      # .bss of zero, because this library has no module state anywhere,
      # and a number other than zero means somebody added some.
      - name: Measure it
        run: bash tools/size.sh

  coverage:
    name: Statement and branch coverage (reporting)
    runs-on: ubuntu-24.04
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      # Reporting rather than blocking, and deliberately without a
      # threshold. What is left uncovered is defensive code the API
      # cannot reach -- an address wrap guard, a March test failure no
      # portable code can provoke -- so any number chosen as a gate would
      # be arbitrary. The table is here to be read when it moves. CLAUDE.md
      # lists what the residue is and why each piece of it cannot be
      # reached.
      #
      # gcc 14 because it is the first with -fcondition-coverage, which
      # adds the MC/DC column. The image's default gcc is 13.
      - name: Install gcc 14
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14

      - name: Measure it
        run: bash tools/coverage.sh gcc-14

      - name: Upload the annotated listings
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: /tmp/escsafelib-coverage/**/*.gcov

  # Blocking since 05/11/2026, once a CI run with a control in front of
  # each check came back clean: general checks and MISRA with the recorded
  # deviations.
  cppcheck:
    name: cppcheck and MISRA C 2012
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      # Until 04/11/2026 every step in this job piped into tee and so
      # reported success whatever cppcheck found, and nothing here showed
      # that the tool ran at all. Each check now exits non zero on a
      # finding, and each is preceded by a control that must produce one.
      # A green job therefore means something, and its conclusion can be
      # read from the public API without the logs.
      - name: Prove cppcheck reports a finding
        run: |
          printf 'int f(void)\n{\n    int a[2] = {0, 0};\n    return a[2];\n}\n' > /tmp/cppcheck_control.c
          if cppcheck --enable=all --std=c99 --error-exitcode=1 \
               /tmp/cppcheck_control.c; then
            echo "cppcheck passed a read past the end of an array"
            exit 1
          fi

      # Three style checks are suppressed because they contradict the
      # convention rather than find anything:
      #   variableScope   every local is declared at the top of its function
      #   unreadVariable  every local is initialised where it is declared
      #   staticFunction  a public function the module also calls itself
      # Older cppcheck releases do not know staticFunction and report its
      # suppression as unmatched, hence unmatchedSuppression.
      # One finding is suppressed inline in sdiag.c, with the reason.
      #
      # Findings are printed as workflow annotations. Job logs need admin
      # rights to read through the API and annotations do not, so this is
      # what lets a finding be read back from the development machine.
      - name: General checks
        run: |
          set -o pipefail
          cppcheck --version
          cppcheck --enable=all --std=c99 --platform=unix32 \
            --template='::error file={file},line={line}::[{id}] {message}' \
            --check-level=exhaustive \
            --error-exitcode=1 \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --suppress=checkersReport \
            --suppress=variableScope \
            --suppress=unreadVariable \
            --suppress=staticFunction \
            --suppress=unmatchedSuppression \
            $( for d in inc/*/; do printf -- " -I%s" "${d%/}"; done ) \
            src/ 2>&1 | tee cppcheck.log

      # tools/misra.sh runs the addon through cppcheck --dump, applies the
      # deviations recorded in CLAUDE.md and the module banners, and fails
      # on anything else. It runs a control first, because --addon=misra
      # printed nothing and returned zero here as well as on the
      # development machine, for a file built to break five rules.
      - name: MISRA C 2012
        if: always()
        run: |
          set -o pipefail
          bash tools/misra.sh --annotate 2>&1 | tee misra.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cppcheck-logs
          path: |
            cppcheck.log
            misra.log

  # Blocking since 05/11/2026: the first run with -Werror and a control
  # came back clean on CI, which is the condition for flipping it.
  host-analyzer:
    name: Host gcc analyzer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # A warning used to leave this job green. -Werror makes a finding
      # fail it, and the control shows the analyzer is really running.
      - name: Prove the analyzer reports a finding
        run: |
          printf 'void f(void)\n{\n    int* p = 0;\n    *p = 1;\n}\n' > /tmp/analyzer_control.c
          if gcc -c -fanalyzer -Werror /tmp/analyzer_control.c -o /tmp/analyzer_control.o; then
            echo "the analyzer passed a NULL dereference"
            exit 1
          fi

      # A different analyzer version from the ones used locally, so it
      # may find things the local runs did not.
      - name: Run gcc -fanalyzer
        run: |
          gcc --version | head -1
          for f in src/*/*.c; do
            d=$(basename $(dirname "$f"))
            echo "== $f"
            gcc -c -Wall -Wextra -Wpedantic -std=c99 -fanalyzer -Werror \
              -I"inc/$d" "$f" -o /tmp/analyzer.o
          done

  # Blocking since 05/11/2026, once a CI run came back warning free.
  docs:
    name: Doxygen
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      # WARN_NO_PARAMDOC is on, so an undocumented parameter shows up here
      # as a warning, and any warning fails the job. The structs are
      # documented from the sources with @struct and @var, which is what
      # took the first local run from sixty warnings to none.
      #
      # An empty warning log would also be what a doxygen that parsed
      # nothing produces, so the job then checks that a page it can only
      # have written from a source comment exists and carries that comment.
      - name: Generate the documentation
        run: |
          doxygen --version
          doxygen Doxyfile 2> doxygen-warnings.log
          echo "---- warnings ----"
          cat doxygen-warnings.log
          if [ -s doxygen-warnings.log ]; then
            # One annotation per warning, readable without the log.
            sed -E "s#^$GITHUB_WORKSPACE/##; s#^([^:]+):([0-9]+): (warning|error): (.*)#::error file=\1,line=\2::\4#" \
              doxygen-warnings.log
            exit 1
          fi
          if ! grep -q "Sum of the samples held" doc/html/structsfilteravg__t.html; then
            echo "::error::doxygen wrote no page carrying the sfilteravg_t member comments"
            ls doc/html | head -50
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: doxygen
          path: |
            doc/
            doxygen-warnings.log
