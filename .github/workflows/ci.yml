name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Two tiers of job.
#
# Blocking jobs run checks that were verified on the development machine
# before this workflow was written, so a red result means a real
# regression rather than a surprise from a tool nobody had run yet.
#
# Reporting jobs run tools that have never executed against this code:
# there is no cppcheck and no doxygen on the development machine, and the
# host gcc analyzer is a different version from the arm one used locally.
# They are marked continue-on-error so that their first run tells us what
# they say instead of blocking the branch. Flip them to blocking once a
# run comes back clean.

jobs:

  # ---------------------------------------------------------------- blocking

  test:
    name: Test (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [ gcc, clang ]
    steps:
      - uses: actions/checkout@v4

      - name: Build the sstring test program
        run: |
          ${{ matrix.cc }} -Wall -Wextra -Wpedantic -std=c99 -g \
            -Iinc/string \
            test/SString_Test/SString_Test.c src/string/sstring.c \
            -o sstring_test

      - name: Run the sstring test program
        run: ./sstring_test

      - name: Build the sarray test program
        run: |
          ${{ matrix.cc }} -Wall -Wextra -Wpedantic -std=c99 -g \
            -Iinc/array \
            test/SArray_Test/SArray_Test.c src/array/sarray.c \
            -o sarray_test

      - name: Run the sarray test program
        run: ./sarray_test

      - name: Build the smemory test program
        run: |
          ${{ matrix.cc }} -Wall -Wextra -Wpedantic -std=c99 -g \
            -Iinc/memory \
            test/SMemory_Test/SMemory_Test.c src/memory/smemory.c \
            -o smemory_test

      - name: Run the smemory test program
        run: ./smemory_test

      - name: Build the smath test program
        run: |
          ${{ matrix.cc }} -Wall -Wextra -Wpedantic -std=c99 -g \
            -Iinc/math \
            test/SMath_Test/SMath_Test.c src/math/smath.c \
            -o smath_test

      - name: Run the smath test program
        run: ./smath_test

      - name: Build the sdiag test program
        run: |
          ${{ matrix.cc }} -Wall -Wextra -Wpedantic -std=c99 -g \
            -Iinc/diag \
            test/SDiag_Test/SDiag_Test.c src/diag/sdiag.c \
            -o sdiag_test

      - name: Run the sdiag test program
        run: ./sdiag_test

      - name: Build the sring test program
        run: |
          ${{ matrix.cc }} -Wall -Wextra -Wpedantic -std=c99 -g \
            -Iinc/ring \
            test/SRing_Test/SRing_Test.c src/ring/sring.c \
            -o sring_test

      - name: Run the sring test program
        run: ./sring_test

      - name: Build the sfilter test program
        run: |
          ${{ matrix.cc }} -Wall -Wextra -Wpedantic -std=c99 -g \
            -Iinc/filter \
            test/SFilter_Test/SFilter_Test.c src/filter/sfilter.c \
            -o sfilter_test

      - name: Run the sfilter test program
        run: ./sfilter_test

      - name: Build the sfixed test program
        run: |
          ${{ matrix.cc }} -Wall -Wextra -Wpedantic -std=c99 -g \
            -Iinc/fixed \
            test/SFixed_Test/SFixed_Test.c src/fixed/sfixed.c \
            -o sfixed_test

      - name: Run the sfixed test program
        run: ./sfixed_test

      - name: Build the sscale test program
        run: |
          ${{ matrix.cc }} -Wall -Wextra -Wpedantic -std=c99 -g \
            -Iinc/scale \
            test/SScale_Test/SScale_Test.c src/scale/sscale.c \
            -o sscale_test

      - name: Run the sscale test program
        run: ./sscale_test

      - name: Build the svote test program
        run: |
          ${{ matrix.cc }} -Wall -Wextra -Wpedantic -std=c99 -g \
            -Iinc/vote \
            test/SVote_Test/SVote_Test.c src/vote/svote.c \
            -o svote_test

      - name: Run the svote test program
        run: ./svote_test

      - name: Build the sfault test program
        run: |
          ${{ matrix.cc }} -Wall -Wextra -Wpedantic -std=c99 -g \
            -Iinc/fault \
            test/SFault_Test/SFault_Test.c src/fault/sfault.c \
            -o sfault_test

      - name: Run the sfault test program
        run: ./sfault_test

      # The generated modules must still be exactly what their generator
      # produces. A non empty diff means somebody edited the output by hand
      # and the next generator run would silently revert it.
      - name: Check the generated modules have not drifted
        run: |
          python3 tools/gen_sarray.py
          python3 tools/gen_sarray_test.py
          python3 tools/gen_smath.py
          python3 tools/gen_smath_test.py
          git diff --stat
          git diff --exit-code

  sanitizers:
    name: ASan and UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # AddressSanitizer does not link under zig on the Windows development
      # machine, which is why the out of bounds read in sstringCopy had to
      # be proven with a guard page instead. Here it works, so this is the
      # first place the module is checked by a real memory sanitizer.
      - name: Build sstring with sanitizers
        run: |
          clang -Wall -Wextra -std=c99 -g \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -fno-omit-frame-pointer \
            -Iinc/string \
            test/SString_Test/SString_Test.c src/string/sstring.c \
            -o sstring_san

      - name: Run sstring under sanitizers
        run: ./sstring_san

      - name: Build sarray with sanitizers
        run: |
          clang -Wall -Wextra -std=c99 -g \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -fno-omit-frame-pointer \
            -Iinc/array \
            test/SArray_Test/SArray_Test.c src/array/sarray.c \
            -o sarray_san

      - name: Run sarray under sanitizers
        run: ./sarray_san

      - name: Build smemory with sanitizers
        run: |
          clang -Wall -Wextra -std=c99 -g \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -fno-omit-frame-pointer \
            -Iinc/memory \
            test/SMemory_Test/SMemory_Test.c src/memory/smemory.c \
            -o smemory_san

      - name: Run smemory under sanitizers
        run: ./smemory_san

      - name: Build smath with sanitizers
        run: |
          clang -Wall -Wextra -std=c99 -g \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -fno-omit-frame-pointer \
            -Iinc/math \
            test/SMath_Test/SMath_Test.c src/math/smath.c \
            -o smath_san

      - name: Run smath under sanitizers
        run: ./smath_san

      - name: Build sdiag with sanitizers
        run: |
          clang -Wall -Wextra -std=c99 -g \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -fno-omit-frame-pointer \
            -Iinc/diag \
            test/SDiag_Test/SDiag_Test.c src/diag/sdiag.c \
            -o sdiag_san

      - name: Run sdiag under sanitizers
        run: ./sdiag_san

      - name: Build sring with sanitizers
        run: |
          clang -Wall -Wextra -std=c99 -g \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -fno-omit-frame-pointer \
            -Iinc/ring \
            test/SRing_Test/SRing_Test.c src/ring/sring.c \
            -o sring_san

      - name: Run sring under sanitizers
        run: ./sring_san

      - name: Build sfilter with sanitizers
        run: |
          clang -Wall -Wextra -std=c99 -g \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -fno-omit-frame-pointer \
            -Iinc/filter \
            test/SFilter_Test/SFilter_Test.c src/filter/sfilter.c \
            -o sfilter_san

      - name: Run sfilter under sanitizers
        run: ./sfilter_san

      - name: Build sfixed with sanitizers
        run: |
          clang -Wall -Wextra -std=c99 -g \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -fno-omit-frame-pointer \
            -Iinc/fixed \
            test/SFixed_Test/SFixed_Test.c src/fixed/sfixed.c \
            -o sfixed_san

      - name: Run sfixed under sanitizers
        run: ./sfixed_san

      - name: Build sscale with sanitizers
        run: |
          clang -Wall -Wextra -std=c99 -g \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -fno-omit-frame-pointer \
            -Iinc/scale \
            test/SScale_Test/SScale_Test.c src/scale/sscale.c \
            -o sscale_san

      - name: Run sscale under sanitizers
        run: ./sscale_san

      - name: Build svote with sanitizers
        run: |
          clang -Wall -Wextra -std=c99 -g \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -fno-omit-frame-pointer \
            -Iinc/vote \
            test/SVote_Test/SVote_Test.c src/vote/svote.c \
            -o svote_san

      - name: Run svote under sanitizers
        run: ./svote_san

      - name: Build sfault with sanitizers
        run: |
          clang -Wall -Wextra -std=c99 -g \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -fno-omit-frame-pointer \
            -Iinc/fault \
            test/SFault_Test/SFault_Test.c src/fault/sfault.c \
            -o sfault_san

      - name: Run sfault under sanitizers
        run: ./sfault_san

  cross-compile:
    name: Cross compile for ARM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      # Compiles only. The runner cannot execute an ARM binary, so this
      # says the code builds for the target, not that it behaves there.
      - name: Compile every module
        run: |
          for f in src/*/*.c; do
            d=$(basename $(dirname "$f"))
            echo "== $f"
            arm-none-eabi-gcc -c -Wall -Wextra -Wpedantic -std=c99 \
              -I"inc/$d" "$f" -o /dev/null
          done

      - name: Run the ARM gcc analyzer
        run: |
          for f in src/*/*.c; do
            d=$(basename $(dirname "$f"))
            echo "== $f"
            arm-none-eabi-gcc -c -Wall -Wextra -Wpedantic -std=c99 -fanalyzer \
              -I"inc/$d" "$f" -o /dev/null
          done

      # Every header must be independently includable and must coexist with
      # the others. This is what catches a duplicate include guard or a
      # clashing typedef.
      - name: Check that all headers coexist
        run: |
          for h in inc/*/*.h; do echo "#include \"$(basename $h)\""; done > allhdr.c
          echo "int main(void){return 0;}" >> allhdr.c
          arm-none-eabi-gcc -c -Wall -Wextra \
            $(for d in inc/*/; do printf " -I%s" "$d"; done) \
            allhdr.c -o /dev/null

  # --------------------------------------------------------------- reporting

  readme-example:
    name: The README example still compiles
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Blocking. It is the only thing in the repository that uses more
      # than one module at once: every test suite covers a single module,
      # so nothing else would notice the example drifting out of step with
      # the library, and it is the first code a reader meets.
      - name: Extract it from README.md and build it
        run: |
          awk '/^```c$/{f=1;next} /^```$/{f=0} f' README.md > example.c
          test -s example.c
          printf 'int main(void){return 0;}\n' > examplemain.c
          gcc -Wall -Wextra -Wpedantic -std=c99 \
            -Iinc/ring -Iinc/string -Iinc/math \
            example.c examplemain.c \
            src/ring/sring.c src/string/sstring.c src/math/smath.c \
            -o readme_example

  doxygen-convention:
    name: Doxygen comment convention
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Blocking, unlike the doxygen job below. This one checks the
      # things doxygen would not: that a @param list matches the
      # signature in both directions, and that a @return names every
      # status the body can produce and no status it cannot. It runs
      # clean on the development machine, so a red result here is a
      # real regression.
      - name: Check the comments against the convention
        run: python3 tools/doxcheck.py

  coverage:
    name: Statement and branch coverage (reporting)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      # Reporting rather than blocking, and deliberately without a
      # threshold. What is left uncovered is defensive code the API
      # cannot reach -- an address wrap guard, a sum that would need
      # sixteen million elements, a March test failure no portable code
      # can provoke -- so any number chosen as a gate would be arbitrary.
      # The table is here to be read when it moves. CLAUDE.md lists what
      # the residue is and why each piece of it cannot be reached.
      - name: Measure it
        run: bash tools/coverage.sh gcc

      - name: Upload the annotated listings
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: /tmp/escsafelib-coverage/**/*.gcov

  cppcheck:
    name: cppcheck (reporting)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: General checks
        run: |
          cppcheck --enable=all --std=c99 --platform=unix32 \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --suppress=checkersReport \
            -Iinc/string -Iinc/array -Iinc/memory -Iinc/math \
            -Iinc/ring -Iinc/filter -Iinc/fixed -Iinc/diag \
            -Iinc/scale -Iinc/vote -Iinc/fault \
            src/ 2>&1 | tee cppcheck.log

      # The MISRA addon reports rule numbers only. The rule texts are
      # copyrighted and cannot ship here, so a hit looks like
      # "misra violation ... [misra-c2012-11.4]" with no description.
      # 11.4 is the one deviation both implemented modules already record,
      # in isOverlapping.
      - name: MISRA C 2012 rule numbers
        run: |
          cppcheck --addon=misra --std=c99 --platform=unix32 \
            --suppress=missingIncludeSystem \
            -Iinc/string src/string/sstring.c 2>&1 | tee misra.log
          cppcheck --addon=misra --std=c99 --platform=unix32 \
            --suppress=missingIncludeSystem \
            -Iinc/array src/array/sarray.c 2>&1 | tee -a misra.log
          cppcheck --addon=misra --std=c99 --platform=unix32 \
            --suppress=missingIncludeSystem \
            -Iinc/memory src/memory/smemory.c 2>&1 | tee -a misra.log
          cppcheck --addon=misra --std=c99 --platform=unix32 \
            --suppress=missingIncludeSystem \
            -Iinc/math src/math/smath.c 2>&1 | tee -a misra.log
          cppcheck --addon=misra --std=c99 --platform=unix32 \
            --suppress=missingIncludeSystem \
            -Iinc/diag src/diag/sdiag.c 2>&1 | tee -a misra.log
          cppcheck --addon=misra --std=c99 --platform=unix32 \
            --suppress=missingIncludeSystem \
            -Iinc/ring src/ring/sring.c 2>&1 | tee -a misra.log
          cppcheck --addon=misra --std=c99 --platform=unix32 \
            --suppress=missingIncludeSystem \
            -Iinc/filter src/filter/sfilter.c 2>&1 | tee -a misra.log
          cppcheck --addon=misra --std=c99 --platform=unix32 \
            --suppress=missingIncludeSystem \
            -Iinc/fixed src/fixed/sfixed.c 2>&1 | tee -a misra.log
          cppcheck --addon=misra --std=c99 --platform=unix32 \
            --suppress=missingIncludeSystem \
            -Iinc/scale src/scale/sscale.c 2>&1 | tee -a misra.log
          cppcheck --addon=misra --std=c99 --platform=unix32 \
            --suppress=missingIncludeSystem \
            -Iinc/vote src/vote/svote.c 2>&1 | tee -a misra.log
          cppcheck --addon=misra --std=c99 --platform=unix32 \
            --suppress=missingIncludeSystem \
            -Iinc/fault src/fault/sfault.c 2>&1 | tee -a misra.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cppcheck-logs
          path: |
            cppcheck.log
            misra.log

  host-analyzer:
    name: Host gcc analyzer (reporting)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # A newer analyzer than the arm-none-eabi 13.2 used locally, so it
      # may find things the local run did not.
      - name: Run gcc -fanalyzer
        run: |
          for f in src/*/*.c; do
            d=$(basename $(dirname "$f"))
            echo "== $f"
            gcc -c -Wall -Wextra -Wpedantic -std=c99 -fanalyzer \
              -I"inc/$d" "$f" -o /dev/null
          done

  docs:
    name: Doxygen (reporting)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen

      # The Doxyfile has never been run. WARN_NO_PARAMDOC is on, so an
      # undocumented parameter shows up here as a warning.
      - name: Generate the documentation
        run: |
          doxygen Doxyfile 2> doxygen-warnings.log
          echo "---- warnings ----"
          cat doxygen-warnings.log
          if [ -s doxygen-warnings.log ]; then
            echo "Doxygen produced warnings. See the log above."
          else
            echo "No warnings."
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doxygen
          path: |
            doc/
            doxygen-warnings.log
